spring.application.name=neurocheck

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/neurocheck_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=innovation!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Automatically create / update tables based on entity classes
spring.jpa.hibernate.ddl-auto=create

# Show SQL in console (useful for debugging)
spring.jpa.show-sql=true

# Format SQL output in logs
spring.jpa.properties.hibernate.format_sql=true

# Naming strategy (ensures Java camelCase ? SQL underscore_names)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# = LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# = OTHER SETTINGS
# ===============================
# Timezone alignment (useful for LocalDate fields)
spring.jackson.time-zone=UTC
